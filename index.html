<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Mya 💖</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Sacramento&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #ffe6ea 0%, #fbcfe8 50%, #f472b6 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .cursive-font {
            font-family: 'Sacramento', cursive;
        }

        /* Floating background elements */
        #heart-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Glassmorphism card effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px rgba(244, 114, 182, 0.25);
        }

        /* Fade and slide animations */
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Pulse glowing heart */
        .pulse-heart {
            animation: pulseGlow 1.5s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(236, 72, 153, 0.4)); }
            100% { transform: scale(1.15); filter: drop-shadow(0 0 18px rgba(236, 72, 153, 0.8)); }
        }

        /* Sad shake animation */
        .shake-animation {
            animation: gentleShake 0.6s ease-in-out;
        }

        @keyframes gentleShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 relative">

    <!-- Background Animated Hearts Canvas -->
    <canvas id="heart-canvas"></canvas>

    <!-- Main Outer Container -->
    <div class="relative z-10 w-full max-w-md mx-auto">
        
        <!-- Interactive Card Container -->
        <div id="main-card" class="glass-card rounded-3xl p-8 text-center transition-all duration-500 transform hover:scale-[1.01]">
            
            <!-- Dynamic Content Display Box -->
            <div id="content-container" class="min-h-[260px] flex flex-col justify-center items-center">
                
                <!-- Initial Loading / Intro visual -->
                <div id="visual-icon" class="mb-4 text-5xl text-pink-500 pulse-heart">
                    💖
                </div>

                <!-- Text Step Display -->
                <h1 id="message-text" class="text-4xl md:text-5xl font-bold text-pink-600 mb-2 leading-tight min-h-[60px] flex items-center justify-center fade-in-up">
                    Mya
                </h1>

                <!-- Subtitle Text -->
                <p id="sub-text" class="text-pink-400 text-lg font-medium opacity-0 transition-opacity duration-500 min-h-[28px]">
                    ✨
                </p>

                <!-- Interactive Buttons Container (Hidden initially) -->
                <div id="button-group" class="hidden mt-8 w-full flex-col sm:flex-row gap-4 justify-center items-center fade-in-up">
                    <button id="yes-btn" onclick="handleYesClick()" class="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold text-lg rounded-full shadow-lg hover:shadow-pink-400/50 hover:scale-105 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
                        <span>Yes!</span> 💖
                    </button>
                    
                    <button id="no-btn" onclick="handleNoClick()" class="w-full sm:w-auto px-8 py-3.5 bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold text-lg rounded-full shadow hover:scale-105 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
                        <span>No</span> 💔
                    </button>
                </div>

            </div>

        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // Canvas floating hearts background system
        const canvas = document.getElementById('heart-canvas');
        const ctx = canvas.getContext('2d');
        let hearts = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Heart {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20;
                this.size = Math.random() * 18 + 10;
                this.speed = Math.random() * 1.5 + 0.8;
                this.opacity = Math.random() * 0.6 + 0.2;
                this.swing = Math.random() * 2;
                this.swingSpeed = Math.random() * 0.03 + 0.01;
            }

            update() {
                this.y -= this.speed;
                this.swing += this.swingSpeed;
                this.x += Math.sin(this.swing) * 0.8;
                if (this.y < -30) this.reset();
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#f472b6';
                ctx.font = `${this.size}px Arial`;
                ctx.fillText('🌸', this.x, this.y);
                ctx.restore();
            }
        }

        for (let i = 0; i < 25; i++) {
            hearts.push(new Heart());
        }

        function animateHearts() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hearts.forEach(h => {
                h.update();
                h.draw();
            });
            requestAnimationFrame(animateHearts);
        }
        animateHearts();

        // Sequence Timers Configuration
        const messageText = document.getElementById('message-text');
        const visualIcon = document.getElementById('visual-icon');
        const subText = document.getElementById('sub-text');
        const buttonGroup = document.getElementById('button-group');
        const mainCard = document.getElementById('main-card');

        // Step 1: Display "Mya" (Already shown on start)
        // Step 2: After 3 seconds, show "I like you"
        setTimeout(() => {
            updateMessage("I like you", "💕", "✨");
            
            // Step 3: After another 3 seconds (6s total), show "Will you be my girlfriend?"
            setTimeout(() => {
                updateMessage("Will you be my girlfriend?", "🌹", "Choose an option below:");
                showButtons();
            }, 3000);

        }, 3000);

        // Helper function to animate text transition smoothly
        function updateMessage(text, icon, subtitle) {
            messageText.classList.remove('fade-in-up');
            void messageText.offsetWidth; // Trigger reflow for animation restart

            messageText.innerText = text;
            messageText.classList.add('fade-in-up');

            if (icon) {
                visualIcon.innerText = icon;
            }
            if (subtitle) {
                subText.innerText = subtitle;
                subText.style.opacity = '1';
            }
        }

        // Show Yes and No options
        function showButtons() {
            buttonGroup.classList.remove('hidden');
            buttonGroup.classList.add('flex');
        }

        // Function triggered on YES click
        function handleYesClick() {
            // Trigger Confetti Celebration
            confetti({
                particleCount: 120,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#f472b6', '#ec4899', '#fb7185', '#ffffff', '#ffd1dc']
            });

            // Trigger continuous side confetti streams
            const duration = 2.5 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 3,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#f472b6', '#fb7185']
                });
                confetti({
                    particleCount: 3,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#f472b6', '#fb7185']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            })();

            // Render Success Content with Contact Info
            const contentContainer = document.getElementById('content-container');
            contentContainer.innerHTML = `
                <div class="fade-in-up flex flex-col items-center">
                    <div class="text-6xl mb-2 pulse-heart">🥰🎉</div>
                    <h2 class="text-3xl font-bold text-pink-600 mb-1">Yay! She said YES!</h2>
                    <p class="text-pink-500 font-bold text-lg mb-1">Thank you so much!!! 💕✨</p>
                    <p class="text-pink-400 text-xs font-medium mb-4">Here's how to reach me 👇</p>
                    
                    <div class="w-full bg-white/90 rounded-2xl p-4 shadow-sm border border-pink-200 flex flex-col gap-3 text-left max-h-[360px] overflow-y-auto custom-scrollbar">
                        
                        <!-- Phone Card -->
                        <div class="flex items-center justify-between p-3 rounded-xl bg-pink-50 hover:bg-pink-100 transition-colors">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-pink-500 text-white flex items-center justify-center text-lg">
                                    <i class="fa-solid fa-phone"></i>
                                </div>
                                <div>
                                    <div class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Phone</div>
                                    <div class="text-gray-800 font-bold text-base">7172090007</div>
                                </div>
                            </div>
                            <button onclick="copyToClipboard('7172090007', this)" class="px-3 py-1.5 bg-pink-200 text-pink-700 text-xs font-semibold rounded-lg hover:bg-pink-300 transition-all flex items-center gap-1">
                                <i class="fa-regular fa-copy"></i> Copy
                            </button>
                        </div>

                        <!-- Snapchat Card -->
                        <div class="flex items-center justify-between p-3 rounded-xl bg-yellow-50 hover:bg-yellow-100 transition-colors">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-yellow-400 text-black flex items-center justify-center text-lg">
                                    <i class="fa-brands fa-snapchat"></i>
                                </div>
                                <div>
                                    <div class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Snapchat</div>
                                    <div class="text-gray-800 font-bold text-base">carsonward24</div>
                                </div>
                            </div>
                            <button onclick="copyToClipboard('carsonward24', this)" class="px-3 py-1.5 bg-yellow-200 text-yellow-800 text-xs font-semibold rounded-lg hover:bg-yellow-300 transition-all flex items-center gap-1">
                                <i class="fa-regular fa-copy"></i> Copy
                            </button>
                        </div>

                        <!-- Instagram Card -->
                        <div class="flex items-center justify-between p-3 rounded-xl bg-purple-50 hover:bg-purple-100 transition-colors">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-yellow-400 via-rose-500 to-purple-600 text-white flex items-center justify-center text-lg">
                                    <i class="fa-brands fa-instagram"></i>
                                </div>
                                <div>
                                    <div class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Instagram</div>
                                    <div class="text-gray-800 font-bold text-base">carsonward85</div>
                                </div>
                            </div>
                            <button onclick="copyToClipboard('carsonward85', this)" class="px-3 py-1.5 bg-purple-200 text-purple-800 text-xs font-semibold rounded-lg hover:bg-purple-300 transition-all flex items-center gap-1">
                                <i class="fa-regular fa-copy"></i> Copy
                            </button>
                        </div>

                        <!-- TikTok Card -->
                        <div class="flex items-center justify-between p-3 rounded-xl bg-slate-900 hover:bg-black transition-colors text-white">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-slate-800 text-white flex items-center justify-center text-lg border border-slate-700">
                                    <i class="fa-brands fa-tiktok"></i>
                                </div>
                                <div>
                                    <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">TikTok</div>
                                    <div class="text-white font-bold text-base">carson_w46</div>
                                </div>
                            </div>
                            <button onclick="copyToClipboard('carson_w46', this)" class="px-3 py-1.5 bg-slate-700 text-white text-xs font-semibold rounded-lg hover:bg-slate-600 transition-all flex items-center gap-1">
                                <i class="fa-regular fa-copy"></i> Copy
                            </button>
                        </div>

                        <!-- Roblox Card -->
                        <div class="flex items-center justify-between p-3 rounded-xl bg-slate-100 hover:bg-slate-200 transition-colors">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-slate-800 text-white flex items-center justify-center text-lg">
                                    <i class="fa-solid fa-gamepad"></i>
                                </div>
                                <div>
                                    <div class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Roblox</div>
                                    <div class="text-gray-800 font-bold text-base">carson56309</div>
                                </div>
                            </div>
                            <button onclick="copyToClipboard('carson56309', this)" class="px-3 py-1.5 bg-slate-300 text-slate-800 text-xs font-semibold rounded-lg hover:bg-slate-400 transition-all flex items-center gap-1">
                                <i class="fa-regular fa-copy"></i> Copy
                            </button>
                        </div>

                        <!-- Discord Card -->
                        <div class="flex items-center justify-between p-3 rounded-xl bg-indigo-50 hover:bg-indigo-100 transition-colors">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center text-lg">
                                    <i class="fa-brands fa-discord"></i>
                                </div>
                                <div>
                                    <div class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Discord</div>
                                    <div class="text-gray-800 font-bold text-base">car563_38417</div>
                                </div>
                            </div>
                            <button onclick="copyToClipboard('car563_38417', this)" class="px-3 py-1.5 bg-indigo-200 text-indigo-800 text-xs font-semibold rounded-lg hover:bg-indigo-300 transition-all flex items-center gap-1">
                                <i class="fa-regular fa-copy"></i> Copy
                            </button>
                        </div>

                    </div>
                </div>
            `;
        }

        // Function triggered on NO click
        function handleNoClick() {
            mainCard.classList.add('shake-animation');
            setTimeout(() => mainCard.classList.remove('shake-animation'), 600);

            const contentContainer = document.getElementById('content-container');
            contentContainer.innerHTML = `
                <div class="fade-in-up flex flex-col items-center">
                    <div class="text-7xl mb-4 animate-bounce">🥺</div>
                    <h2 class="text-4xl font-bold text-gray-700 mb-2">😢</h2>
                    <p class="text-gray-500 text-base mb-6">Aww, my heart is broken...</p>
                    
                    <button onclick="location.reload()" class="px-6 py-2.5 bg-pink-500 text-white text-sm font-bold rounded-full hover:bg-pink-600 transition-all shadow-md">
                        Try Again? 🥺
                    </button>
                </div>
            `;
        }

        // Helper function for reliable text copying inside frame
        function copyToClipboard(text, btn) {
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
            btn.classList.add('bg-green-200', 'text-green-800');

            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('bg-green-200', 'text-green-800');
            }, 2000);
        }
    </script>
</body>
</html>
